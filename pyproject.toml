[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagf-dti"
version = "0.1.0"
description = "Standalone frozen source release of SAGF-DTI Gaussian drug-target interaction prediction"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torch-geometric>=2.6,<3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sagf-dti = "sagf_dti.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sagf_dti*", "my_experiments*"]
namespaces = true

[tool.setuptools.package-data]
sagf_dti = ["paper_manifest.json", "configs/paper/*/*/*.yaml"]
my_experiments = ["scripts/train/09_train_experiment.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
